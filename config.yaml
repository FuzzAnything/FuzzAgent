# Docker environment flag
# True: 1, False: 0
docker: 1 # Don't change this 

# Environment variables for ACI
aci_variables:
  # Default values for ACI file navigation tools
  CURRENT_FILE: ''
  CURRENT_LINE: 0
  OVERLAP: 2
  # Command output and timeout settings
  WINDOW: 100 # File navigation window size in lines, but it can't exceed CMD_OUTPUT_LINES
  CMD_OUTPUT_LINES: 225 # Maximum command output lines for general commands
  MAX_OUTPUT_CHARACTERS: 100000 # Maximum command output characters for general commands
  COMPILER_OUTPUT_LINES: 20 # Maximum command output lines for compiler commands
  WHITELIST_CMD_TIMEOUT: 5400 # Whitelist command timeout in seconds. Now commands in whitelist is: []"run_and_check_build_script", "run_fuzz_target"]
  FUZZER_CHECK_TIMEOUT: 10 # Fuzzer check timeout in seconds
  DISABLE_COVERAGE_GUIDANCE: 0 # Disable coverage guidance in the system prompt

