[project]
name = "fuzzagent-controller"
version = "0.1.0"
description = "FuzzAgent Controller - FastAPI-based fuzzing task management service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.12.4",
    "redis[hiredis]>=5.0.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controller"]
