services:
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:?REDIS_CONTAINER_NAME must be set}
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:?REDIS_PORT must be set}:6379"
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - fuzz_bridge
    restart: unless-stopped

networks:
  fuzz_bridge:
    external: true
    name: fuzz_bridge

volumes:
  redis-data:
    name: ${REDIS_VOLUME_NAME:?REDIS_VOLUME_NAME must be set}
