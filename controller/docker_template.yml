services:
  fuzzagent:
    image: fuzzagent
    container_name: ${CONTAINER_NAME}
    init: true
    stdin_open: true
    tty: true
    command: /bin/bash -c "${COMMAND}"
    volumes:
      - ${FUZZAGENT_DIR}:/root/FuzzAgent:${WRITE_MODE}
      - ${RAW_OUTPUT_DIR}:/root/FuzzAgent/output/${REPO_BASE_NAME}
      - ${SRC_DIR}:/src/${REPO_BASE_NAME}
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      - FUZZAGENT_AUTO_CLEAN=${FUZZAGENT_AUTO_CLEAN:-0}
      - SRC=/root/src/${REPO_BASE_NAME}
      - OUTPUT=/root/FuzzAgent/output/${REPO_BASE_NAME}
      - AFL_SKIP_CPUFREQ=1
      - FUZZING_ENGINE=${FUZZING_ENGINE}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      # Per-model LLM tuning forwarded from Backend's llm_models.toml.
      # Defaults match Core's LLMArgs so missing values still work.
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.6}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
      - LLM_TOP_K=${LLM_TOP_K:-20}
      - LLM_REPLY_TIMEOUT=${LLM_REPLY_TIMEOUT:-600}
      - MAX_AGENT_EPOCHS=${MAX_AGENT_EPOCHS:-100}
      - REMINDER_TOKEN_RATIO=${REMINDER_TOKEN_RATIO:-0.8}
      - MAX_TOKEN_LEN=${MAX_TOKEN_LEN:-128000}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
    restart: "no"
    networks:
      - fuzz_shared_net

networks:
  fuzz_shared_net:
    external: true
    name: fuzz_bridge